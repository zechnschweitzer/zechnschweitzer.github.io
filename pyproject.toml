[project]
name = "zechnschweitzer-github-io"
version = "0.0.1"
description = "Initial website for Zech Schweitzer GitHub"
authors = [
    {name = "Zech Schweitzer",email = "zschw@bu.edu"}
]
readme = "README.md"
requires-python = "^3.10"
dependencies = [
]

[tool.poetry]
packages = [{include = "zechnschweitzer"}]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^2.2.1"
pandas = "^2.2.3"
matplotlib = "^3.10.0"
seaborn = "^0.13.2"
plotly = "^5.24.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"